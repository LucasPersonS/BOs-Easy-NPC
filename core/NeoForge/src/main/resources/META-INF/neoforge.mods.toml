modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/MarkusBordihn/BOs-Easy-NPC/issues"

[[mods]]
modId = "easy_npc"
version = "${file.jarVersion}"
displayName = "Easy NPC — Paravexia Dialogues"
